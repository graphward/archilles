note: >-
  Four layers, linear. `port` holds everything facing outside the normalized
  graph, distinguished by `role`: read, emit, enforce, render. Roles are
  siblings; no edge is declared between them and default-deny does the rest,
  which is why no forbid-edge pair is needed to keep them apart.
