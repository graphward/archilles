id: P0001
kind: layer
order: [entry, port, core, model]
note: >-
  Edges run downward through the order. port holds everything facing outside the
  normalized graph, distinguished by role: read, emit, enforce, render. Roles are
  siblings kept apart by default-deny rather than by a rule, which is why no
  forbid-edge pair exists between them.

  Whether a same-layer edge is permitted is not settled, and an implementation
  importing the interface it satisfies is the ordinary case that decides it.
