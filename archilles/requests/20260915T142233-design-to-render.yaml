# One request event. Written by the tool, never by hand: an agent asked whether
# an import was permitted, and this is what happened.
#
# No edge field. The edge is derivable - the file belongs to a component by path
# prefix, and so does the import - and storing a derivation is how the graph ends
# up living in two places.
#
# No author and no timestamp field either: the commit carries both, and the App
# identity it was committed under is not forgeable by the agent that wrote it.
#
# Named by UTC timestamp because there is one record per event and the same
# import is attempted many times. Hand-authored records keep meaningful names;
# these cannot.

outcome: denied
rule: layering

task: >-
  Render the resolved design as Mermaid from inside the resolver, so that
  archilles resolve --write can emit the diagram in one pass.

evidence:
  - file: pkg/design/resolve.go
    line: 14
    import: archilles/pkg/render

note: >-
  The requesting agent's argument, recorded whether or not it holds. Emitting the
  diagram from the resolver saves a second load of resolved.json, but it puts an
  output format inside core, which is what the layer order exists to prevent.

  The alternative that needs no new edge is for cmd to call resolve and render in
  sequence.
