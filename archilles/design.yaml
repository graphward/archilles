# archilles' own design. Human-authored intent; the tool reads this, never writes it.
#
# A file belongs to the component whose path is its longest prefix match.
# Files matching no component are unassigned, and reported.
#
# Edges are DEFAULT DENY. Each component lists what it may import; anything
# absent is a violation, not an omission.
#
# Four layers, strictly linear: entry -> port -> core -> model.
# port is every component facing something outside the normalized graph,
# distinguished by role:
#
#   read     source -> graph        extract an existing codebase
#   emit     design -> artifact     generate config, schemas, interfaces
#   enforce  design -> toolchain    reject at vet and compile time
#   render   diff   -> output       json, mermaid, text
#
# One package per role. A role splits into subpackages when a second
# implementation exists, not before: pkg/render holds json, mermaid and text
# as files because they render one struct three ways. adapter is split because
# the Adapter interface is fixed in v0 and a Terragrunt adapter is planned.

version: 1

components:
  - name: archilles
    path: cmd/archilles
    tags:
      layer: entry

  - name: archilles-vet
    path: cmd/archilles-vet
    tags:
      layer: entry

  - name: archilles-toolexec
    path: cmd/archilles-toolexec
    tags:
      layer: entry

  - name: adapter
    path: pkg/adapter
    tags:
      layer: port
      role: read

  - name: adapter-golang
    path: pkg/adapter/golang
    tags:
      layer: port
      role: read
      lang: go

  - name: emit
    path: pkg/emit
    tags:
      layer: port
      role: emit
      lang: go

  - name: enforce
    path: pkg/enforce
    tags:
      layer: port
      role: enforce
      lang: go

  - name: render
    path: pkg/render
    tags:
      layer: port
      role: render

  - name: design
    path: pkg/design
    tags:
      layer: core

  - name: rules
    path: pkg/rules
    tags:
      layer: core

  - name: ledger
    path: pkg/ledger
    tags:
      layer: core

  - name: graph
    path: pkg/graph
    tags:
      layer: model

  - name: archgate
    path: internal/archgate
    tags:
      layer: model
      generated: "true"

edges:
  archilles:
    - design
    - rules
    - graph
    - adapter
    - adapter-golang
    - emit
    - render
    - archgate

  archilles-vet:
    - enforce
    - archgate

  archilles-toolexec:
    - enforce
    - archgate

  adapter:
    - design
    - graph

  adapter-golang:
    - adapter
    - design
    - graph

  emit:
    - design
    - graph

  enforce:
    - design
    - graph

  render:
    - design
    - graph

  rules:
    - design
    - graph

  design:
    - ledger
    - graph

  ledger:
    - graph
