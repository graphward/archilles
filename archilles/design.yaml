version: 1

components:
  - name: archilles
    path: cmd/archilles
    tags:
      layer: entry

  - name: archilles-vet
    path: cmd/archilles-vet
    tags:
      layer: entry

  - name: archilles-toolexec
    path: cmd/archilles-toolexec
    tags:
      layer: entry

  - name: adapter
    path: pkg/adapter
    tags:
      layer: port
      role: read

  - name: adapter-golang
    path: pkg/adapter/golang
    tags:
      layer: port
      role: read
      lang: go

  - name: emit
    path: pkg/emit
    tags:
      layer: port
      role: emit
      lang: go

  - name: enforce
    path: pkg/enforce
    tags:
      layer: port
      role: enforce
      lang: go

  - name: render
    path: pkg/render
    tags:
      layer: port
      role: render

  - name: design
    path: pkg/design
    tags:
      layer: core

  - name: rules
    path: pkg/rules
    tags:
      layer: core

  - name: ledger
    path: pkg/ledger
    tags:
      layer: core

  - name: graph
    path: pkg/graph
    tags:
      layer: model

  - name: archgate
    path: internal/archgate
    tags:
      layer: model
      generated: "true"

edges:
  archilles:
    - design
    - rules
    - graph
    - adapter
    - adapter-golang
    - emit
    - render
    - archgate

  archilles-vet:
    - enforce
    - archgate

  archilles-toolexec:
    - enforce
    - archgate

  adapter:
    - design
    - graph

  adapter-golang:
    - adapter
    - design
    - graph

  emit:
    - design
    - graph

  enforce:
    - design
    - graph

  render:
    - design
    - graph

  rules:
    - design
    - graph

  design:
    - ledger
    - graph

  ledger:
    - graph
