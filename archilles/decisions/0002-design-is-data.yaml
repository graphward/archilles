id: D0002
title: Design is data, never code
kind: decision
status: proposed
source: {type: human, ref: handoff}
author: james
approver: james
created: 2026-09-15
context: >-
  No DSL, no Rego, no plugin scripting in v0. Rule kinds are a fixed enum with
  typed params. A design that can execute is a design an agent can talk its way
  around; a design that is data can be diffed, reviewed and schema-validated.
