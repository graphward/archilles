name: archilles-self

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  archilles-self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: plan
        if: github.event_name == 'pull_request'
        run: go run ./cmd/archilles plan --base origin/${{ github.base_ref }}
      - name: check
        if: github.event_name != 'pull_request'
        run: go run ./cmd/archilles check
